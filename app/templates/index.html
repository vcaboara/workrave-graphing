<!DOCTYPE html>
<html>
<head>
    <title>Workrave Stats</title>
    <style>
        body { background-color: #121212; color: white; }
        input[type="file"], input[type="date"], input[type="submit"] { background-color: #333; color: white; border: 1px solid #555; }
    </style>
</head>
<body>
    <h1>Upload Workrave Stats</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="stats"><br><br>
        Start Date: <input type="date" name="start_date"><br>
        End Date: <input type="date" name="end_date"><br><br>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
